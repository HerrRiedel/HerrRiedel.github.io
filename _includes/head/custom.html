<!-- Palette + mode, read synchronously before first paint (no flash):
     - palette (green default / terra) set by /green /terra, key "palette".
     - light/dark set by the masthead sun-moon toggle, key "mode". -->
<script>
  try {
    if (localStorage.getItem('palette') === 'terra') document.documentElement.classList.add('terra');
    if (localStorage.getItem('mode') === 'light') document.documentElement.classList.add('light');
  } catch (e) {}
</script>

<style>
  /* ===== Palette tokens =====================================================
     Green is the default (the :root values). /terra opts into terracotta by
     adding class="terra" to <html>, which only redefines the tokens below.
     Every accent in this file reads a token, so a NEW accent follows the
     palette automatically — it never needs a per-palette rule. */
  :root {
    --bg: #1e2126;                            /* page background (slate)  */
    --surface: #272b31;                       /* content panel            */
    --footer: #16181c;
    --accent: #74a23e;                        /* green                    */
    --accent-soft: rgba(116, 162, 62, 0.40);  /* borders, dividers        */
    --accent-hover-bg: rgba(116, 162, 62, 0.07);
    --accent-hover-border: rgba(116, 162, 62, 0.6);
    --link: #bdcc9f;                          /* content links            */
    --link-hover: #d4e0ba;
    --text: #ede8e0;                          /* primary text             */
    --text-muted: #b8b0a8;                    /* abstracts, card desc     */
    --text-dim: #8a8078;                      /* captions, meta, CV years */
    --text-soft: #d8d0c8;                     /* lede                     */
    --icon: #ede8e0;                          /* crow, masthead icons     */
  }
  html.terra {
    --bg: #231f1c;                            /* original warm charcoal   */
    --surface: #272421;
    --footer: #191614;
    --accent: #b5735a;                        /* terracotta               */
    --accent-soft: rgba(181, 115, 90, 0.35);
    --accent-hover-bg: rgba(181, 115, 90, 0.07);
    --accent-hover-border: rgba(181, 115, 90, 0.6);
    --link: #d7b9aa;                          /* champagne                */
    --link-hover: #e1cbbf;
  }
  /* Light mode — toggled by the sun/moon button. A light ground with the green
     deepened for contrast and text flipped dark. Declared after html.terra so
     it wins if both are ever set (light is always light-green). */
  html.light {
    --bg: #f4f3ef;                            /* warm paper               */
    --surface: #ffffff;
    --footer: #ebe9e3;
    --accent: #4f7328;                        /* deeper green             */
    --accent-soft: rgba(79, 115, 40, 0.30);
    --accent-hover-bg: rgba(79, 115, 40, 0.08);
    --accent-hover-border: rgba(79, 115, 40, 0.5);
    --link: #4f7328;
    --link-hover: #385218;
    --text: #22262b;                          /* dark slate               */
    --text-muted: #5f6670;
    --text-dim: #6b727a;
    --text-soft: #55606a;
    --icon: #22262b;
  }

  /* Palette applied to theme surfaces + links (these override the compiled
     terracotta skin; all palettes read the tokens above). */
  body, .initial-content, .search-content, .masthead, nav.greedy-nav, #main {
    background-color: var(--bg);
  }
  .page__footer { background-color: var(--footer); }
  .page__content a { color: var(--link); }
  .page__content a:hover { color: var(--link-hover); }
  .greedy-nav .visible-links a:before { background: var(--accent); }
  .greedy-nav__toggle .navicon,
  .greedy-nav__toggle .navicon:before,
  .greedy-nav__toggle .navicon:after { background: var(--accent); }
  /* keep the hamburger/× green on hover+tap (theme's :hover repaints it in the
     old terracotta) and keep the open-menu overlay on-palette */
  .greedy-nav__toggle:hover .navicon,
  .greedy-nav__toggle:hover .navicon:before,
  .greedy-nav__toggle:hover .navicon:after { background: var(--accent); }
  .greedy-nav__toggle:before { background-color: var(--bg); }

  /* Text — flips to dark in light mode via the --text token. */
  body,
  .page__content,
  .page__title, .page__title a,
  .page__content h1, .page__content h2, .page__content h3, .page__content h4,
  .sidebar .author__name, .author__urls a,
  .greedy-nav .site-title, .greedy-nav .visible-links a, .greedy-nav .hidden-links a {
    color: var(--text);
  }
  .page__footer, .page__footer a { color: var(--text-dim); }
  #crow-svg g { fill: var(--icon); }
  /* hamburger dropdown surface follows the palette too */
  .greedy-nav .hidden-links { background: var(--surface); }

  /* Light/dark toggle button (replaces the retired search icon). Sun shows in
     dark mode (click → light), moon shows in light mode (click → dark). */
  .theme-toggle {
    align-self: center;
    flex: none;
    box-sizing: content-box;
    width: 1.2em;             /* fixed footprint — sun and moon occupy the same
                                 space, so toggling never shifts the nav tabs */
    padding: 0 0.3em;
    text-align: center;
    background: transparent;
    border: 0;
    margin: 0;
    cursor: pointer;
    color: var(--accent);
    font-size: 1.15em;
    line-height: 1;
  }
  .theme-toggle:hover { color: var(--accent-hover-border); }
  .theme-toggle:focus:not(:focus-visible) { outline: none; }
  .theme-toggle svg.theme-icon-sun { height: 1.15em; width: 1.15em; vertical-align: -0.18em; }
  .theme-toggle .theme-icon-moon { display: none; }
  html.light .theme-toggle .theme-icon-sun { display: none; }
  html.light .theme-toggle .theme-icon-moon { display: inline; }

  /* Name is shown in the masthead now, so hide it under the sidebar photo */
  .author__name { display: none; }

  /* The theme dims the whole sidebar to 85% opacity (brightening on hover),
     which reads as a tint/"film" over the photo. Keep it at full opacity. */
  .sidebar { opacity: 1; }

  /* Tighten gap between author name and links */
  .author__content {
    margin-bottom: 0.4em;
  }
  /* Reduce bottom padding of sidebar box */
  .sidebar.sticky {
    padding-bottom: 0.5em;
  }
  .author__urls-wrapper {
    margin-top: 0.2em;
  }
  /* Tighten spacing between individual links */
  .author__urls li {
    line-height: 1.2;
    margin-bottom: 0;
    padding-top: 0.05em;
    padding-bottom: 0.05em;
  }

  /* Profile photo: remove border, fill sidebar width */
  .author__avatar img {
    border: none !important;
    max-width: 100%;
    padding: 0 !important;
  }

  /* Section headings: smaller than page title */
  article.page h2 {
    font-size: 1.1em;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    border-bottom: none;
    margin-top: 1.4em;
  }

  /* Content area sits slightly above sidebar — creates depth (~2% lift) */
  article.page {
    background-color: var(--surface);
    display: flow-root;   /* contain the floated inner wrap so the surface tone
                             covers the whole content area (fixes mobile, where it
                             collapsed and the text sat on the page background) */
    padding-left: 2em;
    padding-top: 0.5em;
    padding-bottom: 0.5em;
  }
  .wide article.page {
    padding-right: 2em;
  }

  /* Section divider on content pages */
  .page__content hr {
    border: none;
    border-top: 1px solid var(--accent-soft);
    margin: 2em 0;
  }

  /* Hide heading permalink anchors */
  .header-link {
    display: none !important;
  }


  /* Consulting page: figure */
  .mami-fig {
    margin: 1.6em 0 1.8em 0;
  }
  .mami-fig img {
    width: 100%;
    display: block;
    border: 1px solid var(--accent-soft);
  }
  /* The theme puts margin-bottom:1em on any img inside a figure; that plus the
     caption's own top margin left a ~1.6em gap. Kill the first, shrink the second. */
  .mami-fig img {
    margin-bottom: 0;
  }
  .mami-fig figcaption {
    font-size: 0.8em;
    color: var(--text-dim);
    line-height: 1.6;
    margin-top: 0.35em;
    padding-left: 0.1em;
  }

  /* Consulting page: opening question */
  .lede {
    font-size: 1.25em;
    line-height: 1.5;
    color: var(--text-soft);
    border-left: 3px solid var(--accent);
    padding-left: 0.9em;
    margin: 0.2em 0 1.4em 0;
    font-style: italic;
  }

  /* Consulting page: demo callout card */
  .demo-card {
    display: block;
    border: 1px solid var(--accent-soft);
    border-left: 3px solid var(--accent);
    padding: 1em 1.2em;
    margin: 0.4em 0 1.6em 0;
    text-decoration: none !important;
    transition: background-color 0.15s ease, border-color 0.15s ease;
  }
  .demo-card:hover {
    background-color: var(--accent-hover-bg);
    border-color: var(--accent-hover-border);
    border-left-color: var(--accent);
  }
  .demo-card .demo-title {
    display: block;
    font-weight: 600;
    color: var(--accent);
    margin-bottom: 0.45em;
  }
  .demo-card .demo-desc {
    display: block;
    font-size: 0.85em;
    color: var(--text-muted);
    line-height: 1.65;
    text-align: justify;
  }
  .demo-card .demo-meta {
    display: block;
    font-size: 0.75em;
    color: var(--text-dim);
    margin-top: 0.7em;
    letter-spacing: 0.02em;
  }

  /* Research page: the JMP badge. Text is #272421 — the content panel's own
     background — so the letters read as knocked out of the terracotta. */
  .page__content .jmp-tag {
    display: inline-block;
    background-color: var(--accent);
    color: var(--surface);
    border-radius: 3px;
    padding: 0.08em 0.45em 0.12em;
    margin-left: 0.15em;
    font-size: 0.68em;
    font-weight: 700;
    letter-spacing: 0.06em;
    vertical-align: 0.12em;
  }

  /* About: CV / JMP pill links — outlined, turning green on hover. */
  .about-links {
    display: flex;
    flex-wrap: wrap;
    align-items: stretch;   /* pills + badge share one height */
    gap: 0.6em;
    margin: 0.9em 0 1.3em;
  }
  /* Job-market status badge, sitting in the pill row at the same height as the
     pills (matched padding/border/font); filled green knockout like the JMP tag. */
  .about-links .jm-badge {
    display: inline-flex;
    align-items: center;
    padding: 0.42em 0.8em;
    border: 1px solid transparent;
    border-radius: 5px;
    background-color: var(--accent);
    color: var(--surface);
    font-size: 0.9em;
    font-weight: 700;
    letter-spacing: 0.03em;
    line-height: 1;
    white-space: nowrap;
  }
  .page__content .about-link {
    display: inline-flex;
    align-items: center;
    gap: 0.5em;
    padding: 0.42em 0.95em;
    border: 1px solid var(--accent-soft);
    border-radius: 5px;
    color: var(--text);
    text-decoration: none !important;
    font-size: 0.9em;
    line-height: 1;
    transition: border-color 0.15s ease, color 0.15s ease, background-color 0.15s ease;
  }
  .page__content .about-link:hover {
    border-color: var(--accent);
    color: var(--accent);
    background-color: var(--accent-hover-bg);
  }
  .about-link svg { width: 1.05em; height: 1.05em; flex: none; }

  /* Title-row badge (e.g. job-market status beside the page title). Same green
     knockout idiom as the JMP tag, scaled up to sit in the h1 title row. */
  .page__title .title-badge {
    display: inline-block;
    background-color: var(--accent);
    color: var(--surface);
    border-radius: 4px;
    padding: 0.2em 0.55em;
    margin-left: 0.45em;
    font-size: 0.52em;         /* scaled so the badge box matches "About"'s height */
    font-weight: 700;
    letter-spacing: 0.04em;
    vertical-align: 0.4em;     /* raise by ~(padding-bottom + descent) so the box
                                  bottom sits on the title's baseline, not sinking */
    white-space: nowrap;
    line-height: 1;
  }

  /* Research page: abstract left-bar style */
  .paper-abstract {
    border-left: 2px solid var(--accent);
    padding-left: 1em;
    margin: -0.8em 0 2.8em 0;
    font-size: 0.85em;
    color: var(--text-muted);
    line-height: 1.65;
    text-align: justify;
  }

  /* Justified body prose on the About and Consulting pages (pages that opt in
     with the `justify-body` class). Left-aligned again on mobile, below. */
  .justify-body .page__content p {
    text-align: justify;
  }

  /* ===================================================================
     Mobile only (≤768px). Desktop (≥769px) is unchanged by everything
     in this block. Phones + portrait tablets; the sidebar already
     stacks below 925px, so this never touches the computer layout.
     =================================================================== */
  @media (max-width: 768px) {
    /* Justify makes rivers of whitespace in a narrow column — left-align. */
    .paper-abstract,
    .demo-card .demo-desc,
    .justify-body .page__content p {
      text-align: left;
    }

    /* Author profile: stack it (avatar → name → email/X) like the wide-screen
       sidebar, instead of the theme's cramped avatar | name | Follow row.
       The avatar grows but stays capped; the Follow toggle is dropped and the
       links show inline. */
    .author__avatar {
      display: block;
      width: auto;
      height: auto;
      text-align: center;
    }
    .author__avatar img {
      display: block;
      margin: 0 auto;
      width: 100%;
      max-width: 240px;   /* larger than the theme's 180px cell, but held back */
    }
    .author__content {
      display: block;
      width: 100%;
      padding-left: 0;
      padding-right: 0;
      margin-top: 0.7em;
      text-align: center;
    }
    .author__urls-wrapper {
      display: block;
    }
    .author__urls-wrapper > button {
      display: none;   /* the "Follow" toggle — email/X are shown directly instead */
    }
    .author__urls {
      display: block;
      position: relative;
      margin: 0.4em 0 0;
      padding: 0;
      border: 0;
      background: transparent;
      box-shadow: none;
      text-align: center;
    }
    .author__urls:before,
    .author__urls:after {
      display: none;   /* the dropdown pointer triangle */
    }
    .author__urls li {
      white-space: normal;
    }

    /* Nav: put every item — About included — behind the hamburger on a phone.
       The theme's "greedy nav" keeps as many links inline as fit and overflows
       only the rest into the hamburger, which on a narrow screen leaves "About"
       sitting next to the toggle. Making each item measure wider than the row
       makes the greedy-nav script — which parks any item that doesn't fit —
       move ALL of them into the hamburger, using the theme's own overflow logic
       (no markup or JS changes). Once moved into .hidden-links (a different
       selector) the items regain normal width, so the open menu looks normal.
       visible-links has overflow:hidden, so the oversized items never cause a
       horizontal scrollbar in the brief moment before the script runs. */
    .greedy-nav .visible-links .masthead__menu-item {
      min-width: 100vw;
    }

    /* Education table: on desktop it's aligned columns (degree | school | year
       · descriptor) that run off a phone screen. Reflow each row to two lines —
       degree + school, then year · descriptor below — by collapsing the table
       to blocks and turning the (desktop) spacer cell into the line break.
       Font, colour, and size are inherited from the cells' own inline styles,
       so they're unchanged; only the flow differs. */
    .edu-table,
    .edu-table tbody,
    .edu-table tr,
    .edu-table td {
      display: block;
    }
    .edu-table tr {
      padding: 5px 0;
    }
    .edu-table td {
      display: inline;
      padding: 0 !important;   /* override the per-cell inline paddings */
    }
    .edu-table td:nth-child(2) {
      margin-left: 0.6em;      /* gap between degree and school */
    }
    .edu-table td:nth-child(3) {
      display: block;          /* the empty spacer cell → forces year onto line 2 */
    }
  }
</style>

<!-- crow easter egg -------------------------------------------------------- -->
<style>
  #crow-logo { position: relative; display: inline-block; cursor: pointer; }
  #crow-logo:focus:not(:focus-visible),
  #crow-title:focus:not(:focus-visible) { outline: none; }

  /* Animate the SVG crow directly — no element swapping */
  #crow-svg { transform-origin: center 84%; }

  @keyframes crow-flap {
    0%   { transform: translateY(0px)  rotate(0deg);  }
    12%  { transform: translateY(-5px) rotate(-7deg); }
    24%  { transform: translateY(-1px) rotate(4deg);  }
    36%  { transform: translateY(-6px) rotate(-8deg); }
    48%  { transform: translateY(-2px) rotate(3deg);  }
    60%  { transform: translateY(-4px) rotate(-5deg); }
    72%  { transform: translateY(-1px) rotate(2deg);  }
    86%  { transform: translateY(-2px) rotate(-1deg); }
    100% { transform: translateY(0px)  rotate(0deg);  }
  }
  @keyframes crow-peck {
    0%   { transform: rotate(0deg);  }
    35%  { transform: rotate(22deg); }
    60%  { transform: rotate(22deg); }
    100% { transform: rotate(0deg);  }
  }
  @keyframes crow-eat {
    0%   { transform: rotate(0deg);  }
    30%  { transform: rotate(18deg); }
    55%  { transform: rotate(18deg); }
    80%  { transform: rotate(-3deg); }
    100% { transform: rotate(0deg);  }
  }

  #crow-svg.crow-flapping { animation: crow-flap 1.2s ease-in-out forwards; }
  #crow-svg.crow-pecking  { animation: crow-peck 0.7s ease-in-out forwards; }
  #crow-svg.crow-eating   { animation: crow-eat  0.5s ease-in-out forwards; }

  /* Item overlaid at beak tip — shifted left/up so item sits in beak */
  #crow-item {
    position: absolute;
    left: 82%;
    top: 24%;
    transform: translateY(-50%);
    opacity: 0;
    transition: opacity 0.15s ease;
    pointer-events: none;
    overflow: visible;
  }
  #crow-item.visible { opacity: 1; }
</style>

<script>
document.addEventListener('DOMContentLoaded', function () {
  var crowLogo  = document.getElementById('crow-logo');
  var crowTitle = document.getElementById('crow-title');
  var crowSVG   = document.getElementById('crow-svg');
  if (!crowLogo || !crowSVG) return;

  /* Item overlay element */
  var itemEl = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  itemEl.id = 'crow-item';
  itemEl.setAttribute('width', '18');
  itemEl.setAttribute('height', '14');
  itemEl.setAttribute('viewBox', '0 0 18 14');
  itemEl.setAttribute('overflow', 'visible');
  crowLogo.appendChild(itemEl);

  var COIN  = '<circle cx="7" cy="7" r="5.5" fill="#c49a46"/>'
            + '<circle cx="7" cy="7" r="3.8" fill="none" stroke="#d9b96a" stroke-width="0.9"/>';
  var STICK = '<line x1="1" y1="7" x2="16" y2="1" stroke="#b5735a" stroke-width="2.2" stroke-linecap="round"/>'
            + '<line x1="9" y1="4" x2="13" y2="-1" stroke="#b5735a" stroke-width="1.6" stroke-linecap="round"/>';
  var BILL  = '<rect x="0" y="4" width="17" height="10" rx="1" fill="#74a23e"/>'
            + '<text x="8" y="12" font-size="7" font-family="serif" font-weight="bold" fill="#1e2126" text-anchor="middle" opacity="0.5">$</text>';

  /* Clicks cycle bill -> coin -> stick, swapping the held item directly (no
     drop between them); after the stick, a click makes the crow leave it. */
  var ITEMS = [BILL, COIN, STICK];
  var heldIndex = -1;

  var IDLE = 0, ANIM = 1, HOLDING = 2;
  var state = IDLE;

  function triggerCrow(e) {
    e.preventDefault();
    if (state === ANIM) return;
    if (state === IDLE) {
      startPickup();                          // first click: fly in, grab the bill
    } else if (heldIndex < ITEMS.length - 1) {
      swapItem();                             // next clicks: bill -> coin -> stick
    } else {
      dropItem();                             // after the stick: leave it, back to idle
    }
  }

  /* IDLE -> flap in, peck, come up holding the first item (bill). */
  function startPickup() {
    state = ANIM;
    heldIndex = 0;

    /* Phase 1: flap (1.2s) */
    crowSVG.classList.add('crow-flapping');
    setTimeout(function () {
      crowSVG.classList.remove('crow-flapping');

      /* Phase 2: peck (0.7s) — item appears when the head returns */
      crowSVG.classList.add('crow-pecking');
      setTimeout(function () {
        crowSVG.classList.remove('crow-pecking');
        itemEl.innerHTML = ITEMS[heldIndex];
        itemEl.classList.add('visible');
        state = HOLDING;
      }, 700);
    }, 1200);
  }

  /* HOLDING -> a single peck swaps the held item for the next one (no drop). */
  function swapItem() {
    state = ANIM;
    heldIndex++;
    itemEl.classList.remove('visible');
    crowSVG.classList.add('crow-pecking');
    setTimeout(function () {
      crowSVG.classList.remove('crow-pecking');
      itemEl.innerHTML = ITEMS[heldIndex];
      itemEl.classList.add('visible');
      state = HOLDING;
    }, 700);
  }

  /* After the last item (stick), a click makes the crow leave it and reset. */
  function dropItem() {
    state = ANIM;
    itemEl.classList.remove('visible');
    crowSVG.classList.add('crow-eating');
    setTimeout(function () {
      crowSVG.classList.remove('crow-eating');
      itemEl.innerHTML = '';
      heldIndex = -1;
      state = IDLE;
    }, 500);
  }

  [crowLogo, crowTitle].forEach(function (el) {
    if (el) el.addEventListener('click', triggerCrow);
  });
});
</script>

<!-- Light/dark toggle (masthead sun/moon button) -->
<script>
document.addEventListener('DOMContentLoaded', function () {
  var t = document.getElementById('theme-toggle');
  if (!t) return;
  t.addEventListener('click', function () {
    var light = document.documentElement.classList.toggle('light');
    try { if (light) localStorage.setItem('mode', 'light'); else localStorage.removeItem('mode'); } catch (e) {}
  });
});
</script>
